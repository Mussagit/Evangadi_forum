services:
  - type: web
    name: ai-powered-evangadi-forum-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix backend install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3779
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 25060
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
